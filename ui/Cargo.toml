[package]
name = "harbor-desk-ui"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "harbor_desk_ui"

[dependencies]
workplace-sim = { path = "..", default-features = false }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "=0.2.127"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Storage",
    "Location",
    "EventTarget",
] }
